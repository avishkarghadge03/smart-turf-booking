# ==========================================================
# Smart Turf Booking & Management System
# Application Configuration
# ==========================================================

spring.application.name=smart-turf-booking

# MySQL Database Configuration
# NOTE FOR STUDENTS / DEVELOPERS:
# Update 'spring.datasource.password' with your local MySQL root password.
spring.datasource.url=jdbc:mysql://localhost:3306/smart_turf_booking_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=avi123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'update' automatically generates and updates table schemas based on entity definitions
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080
