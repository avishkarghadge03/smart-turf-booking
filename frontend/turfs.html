<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Sports Turfs - Smart Turf Booking System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-trophy-fill text-success fs-4 me-2"></i>
        <span>Smart</span>Turf
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="turfs.html">Explore Turfs</a></li>
          <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
        </ul>
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center" id="auth-nav-items"></ul>
      </div>
    </div>
  </nav>

  <main class="py-4">
    <div class="container">
      <!-- Title & Search/Filter Controls -->
      <div class="mb-4">
        <h2 class="fw-bold text-dark mb-1">Explore Sports Arenas <span id="turf-count" class="text-muted fs-5"></span></h2>
        <p class="text-muted small">Choose your preferred sport, location, and lock in your match time.</p>

        <!-- Filters Bar -->
        <div class="card p-3 border-0 shadow-sm rounded-3 bg-white mt-3">
          <form id="turf-search-form" class="row g-2 align-items-center">
            <div class="col-md-5">
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="search-input" class="form-control border-start-0" placeholder="Search by name, city, or area...">
              </div>
            </div>
            <div class="col-md-3 col-6">
              <select id="sport-filter" class="form-select">
                <option value="">All Sports</option>
                <option value="Football">Football</option>
                <option value="Cricket">Cricket</option>
                <option value="Badminton">Badminton</option>
                <option value="Multi-Sport">Multi-Sport</option>
              </select>
            </div>
            <div class="col-md-3 col-6">
              <select id="price-filter" class="form-select">
                <option value="">Sort by Price</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
              </select>
            </div>
            <div class="col-md-1">
              <button type="submit" class="btn btn-primary-turf w-100"><i class="bi bi-funnel"></i></button>
            </div>
          </form>
        </div>
      </div>

      <!-- Turf Cards Grid -->
      <div class="row" id="turfs-list-container">
        <!-- Loaded via turf.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container text-center small text-muted">
      &copy; 2026 Smart Turf Booking System.
    </div>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/turf.js"></script>
</body>
</html>
