<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turf Form - Smart Turf Admin</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

  <!-- Admin Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top px-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="dashboard.html">
        <i class="bi bi-shield-lock-fill text-danger me-2"></i>
        <span>Smart</span>Turf <span class="badge bg-danger ms-1" style="font-size: 0.65rem;">ADMIN</span>
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="turfs.html">Turfs</a></li>
        </ul>
        <a href="turfs.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to Turfs</a>
      </div>
    </div>
  </nav>

  <main class="py-4">
    <div class="container" style="max-width: 800px;">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h3 class="fw-bold text-dark mb-4 border-bottom pb-2" id="turf-form-title">Add New Turf Arena</h3>

        <form id="admin-turf-form">
          <input type="hidden" id="turf-id">

          <div class="row g-3 mb-3">
            <div class="col-md-8">
              <label for="turf-name" class="form-label fw-semibold small">Turf Arena Name</label>
              <input type="text" id="turf-name" class="form-control" placeholder="e.g. KickOff Box Cricket & Football Turf" required>
            </div>
            <div class="col-md-4">
              <label for="turf-status" class="form-label fw-semibold small">Status</label>
              <select id="turf-status" class="form-select">
                <option value="AVAILABLE">AVAILABLE</option>
                <option value="UNAVAILABLE">UNAVAILABLE</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="turf-location" class="form-label fw-semibold small">Location / Address</label>
            <input type="text" id="turf-location" class="form-control" placeholder="e.g. Andheri West, Mumbai" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label for="turf-sport" class="form-label fw-semibold small">Sport Type</label>
              <input type="text" id="turf-sport" class="form-control" placeholder="e.g. Football & Cricket" required>
            </div>
            <div class="col-md-4">
              <label for="turf-price" class="form-label fw-semibold small">Price Per Hour (₹)</label>
              <input type="number" step="0.01" id="turf-price" class="form-control" placeholder="e.g. 1200.00" required min="1">
            </div>
            <div class="col-md-4">
              <label for="turf-capacity" class="form-label fw-semibold small">Max Player Capacity</label>
              <input type="number" id="turf-capacity" class="form-control" placeholder="e.g. 14" required min="1">
            </div>
          </div>

          <div class="mb-3">
            <label for="turf-image" class="form-label fw-semibold small">Image URL</label>
            <input type="url" id="turf-image" class="form-control" placeholder="https://images.unsplash.com/photo-..." required>
          </div>

          <div class="mb-4">
            <label for="turf-description" class="form-label fw-semibold small">Description & Amenities</label>
            <textarea id="turf-description" class="form-control" rows="4" placeholder="Detail the grass pitch quality, floodlights, parking, and locker rooms."></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="turfs.html" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary-turf px-4">
              <i class="bi bi-check2 me-1"></i>Save Arena Details
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
