<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration - Smart Turf Booking System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-trophy-fill text-success fs-4 me-2"></i>
        <span>Smart</span>Turf
      </a>
      <div class="ms-auto">
        <a href="login.html" class="nav-link text-white"><i class="bi bi-box-arrow-in-right me-1"></i>Sign In</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
          <div class="text-center mb-4">
            <div class="stat-icon users mx-auto mb-2">
              <i class="bi bi-person-plus fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark">Create Account</h3>
            <p class="text-muted small">Register to book sports turfs across top cities</p>
          </div>

          <div id="register-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

          <form id="register-form">
            <div class="mb-3">
              <label for="reg-name" class="form-label fw-semibold small">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Sharma" required minlength="2">
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-email" class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-phone" class="form-label fw-semibold small">Phone Number</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-telephone text-muted"></i></span>
                <input type="tel" id="reg-phone" class="form-control" placeholder="e.g. 9820112233" required pattern="[0-9]{10,15}">
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-password" class="form-label fw-semibold small">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-role" class="form-label fw-semibold small">Account Role</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-check text-muted"></i></span>
                <select id="reg-role" class="form-select">
                  <option value="CUSTOMER">Customer / Player</option>
                  <option value="OWNER">Turf Owner / Manager</option>
                  <option value="ADMIN">Platform Administrator</option>
                </select>
              </div>
              <small class="text-muted" id="role-hint">Book turfs and manage reservations</small>
            </div>

            <button type="submit" id="reg-btn" class="btn btn-primary-turf w-100 py-2 fw-semibold mt-2">
              <i class="bi bi-check2-circle me-1"></i>Create Account
            </button>
          </form>

          <div class="text-center mt-4 text-muted small">
            Already registered? <a href="login.html" class="text-success fw-semibold">Sign in here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Check if role passed via query parameter (e.g. ?role=ADMIN)
    const urlParams = new URLSearchParams(window.location.search);
    const paramRole = urlParams.get("role");
    const roleSelect = document.getElementById("reg-role");
    const roleHint = document.getElementById("role-hint");
    const regBtn = document.getElementById("reg-btn");

    function updateRoleUI(role) {
      if (role === "ADMIN") {
        roleHint.textContent = "Full administrative access to manage turfs, users, bookings, and payments.";
        regBtn.className = "btn btn-danger w-100 py-2 fw-semibold mt-2";
        regBtn.innerHTML = `<i class="bi bi-shield-lock-fill me-1"></i>Create Administrator Account`;
      } else if (role === "OWNER") {
        roleHint.textContent = "Register as a Turf Arena Owner to list and manage sports venues.";
        regBtn.className = "btn btn-warning text-dark w-100 py-2 fw-semibold mt-2";
        regBtn.innerHTML = `<i class="bi bi-building me-1"></i>Create Turf Owner Account`;
      } else {
        roleHint.textContent = "Book turfs and manage reservations across top venues.";
        regBtn.className = "btn btn-primary-turf w-100 py-2 fw-semibold mt-2";
        regBtn.innerHTML = `<i class="bi bi-check2-circle me-1"></i>Create Customer Account`;
      }
    }

    if (paramRole && ["ADMIN", "OWNER", "CUSTOMER"].includes(paramRole.toUpperCase())) {
      roleSelect.value = paramRole.toUpperCase();
      updateRoleUI(paramRole.toUpperCase());
    }

    roleSelect.addEventListener("change", () => {
      updateRoleUI(roleSelect.value);
    });

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const phone = document.getElementById("reg-phone").value.trim();
      const password = document.getElementById("reg-password").value;
      const role = document.getElementById("reg-role").value;
      const alertEl = document.getElementById("register-alert");
      const btn = document.getElementById("reg-btn");

      alertEl.classList.add("d-none");
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Registering...`;

      try {
        const endpoint = role === "ADMIN" ? `${API_BASE_URL}/admin/register` : `${API_BASE_URL}/users/register`;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, phone, password, role })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          if (role === "ADMIN") {
            alert("Administrator registered successfully in MySQL! Redirecting to Admin Login.");
            window.location.href = "admin/login.html";
          } else {
            alert("Registration successful! Please login with your credentials.");
            window.location.href = "login.html";
          }
        } else {
          alertEl.textContent = data.message || "Registration failed. Please check inputs.";
          alertEl.classList.remove("d-none");
          btn.disabled = false;
          updateRoleUI(role);
        }
      } catch (err) {
        console.error(err);
        alertEl.textContent = "Could not connect to backend server. Make sure Spring Boot is running.";
        alertEl.classList.remove("d-none");
        btn.disabled = false;
        updateRoleUI(role);
      }
    });
  </script>
</body>
</html>
