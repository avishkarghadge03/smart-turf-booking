<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Complaints - Smart Turf Booking System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-trophy-fill text-success fs-4 me-2"></i>
        <span>Smart</span>Turf
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="turfs.html">Explore Turfs</a></li>
          <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
          <li class="nav-item"><a class="nav-link active" href="complaints.html">Complaints</a></li>
          <li class="nav-item"><a class="nav-link" href="reviews.html">Reviews</a></li>
        </ul>
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center" id="auth-nav-items"></ul>
      </div>
    </div>
  </nav>

  <main class="py-4">
    <div class="container">
      <div class="mb-4">
        <h2 class="fw-bold text-dark mb-1">Customer Support & Grievances</h2>
        <p class="text-muted small">Encountered an issue with venue facilities or reservations? File a ticket below.</p>
      </div>

      <div class="row g-4">
        <!-- Complaint Form -->
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <h5 class="fw-bold text-dark mb-3"><i class="bi bi-shield-exclamation me-2 text-danger"></i>Raise a Complaint</h5>

            <form id="complaint-form">
              <div class="mb-3">
                <label for="complaint-subject" class="form-label fw-semibold small">Subject / Issue Summary</label>
                <input type="text" id="complaint-subject" class="form-control" placeholder="e.g. Floodlights issue, locker locked" required minlength="3">
              </div>

              <div class="mb-3">
                <label for="complaint-description" class="form-label fw-semibold small">Detailed Description</label>
                <textarea id="complaint-description" class="form-control" rows="5" placeholder="Please describe what happened, turf name, time of issue, etc." required></textarea>
              </div>

              <button type="submit" class="btn btn-primary-turf w-100 py-2 fw-semibold">
                <i class="bi bi-send me-1"></i>Submit Ticket
              </button>
            </form>
          </div>
        </div>

        <!-- My Complaints List -->
        <div class="col-lg-7">
          <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <h5 class="fw-bold text-dark mb-3"><i class="bi bi-journal-text me-2 text-success"></i>My Complaint History</h5>
            <div id="complaints-list-container">
              <!-- Loaded by complaint.js -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/complaint.js"></script>
</body>
</html>
